[tool.poetry]
name = "busla-api"
version = "0.1.0"
description = "BUSLA backend — Django + DRF + Channels + Celery + PostGIS + OR-Tools"
authors = ["BUSLA"]
readme = "README.md"
packages = [{ include = "busla" }, { include = "config" }]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.1"
djangorestframework = "^3.15"
djangorestframework-simplejwt = "^5.3"
drf-spectacular = "^0.28"
django-cors-headers = "^4.6"
django-environ = "^0.11"
django-filter = "^24.3"
channels = { extras = ["daphne"], version = "^4.2" }
channels-redis = "^4.2"
celery = { extras = ["redis"], version = "^5.4" }
redis = "^5.2"
psycopg = { extras = ["binary"], version = "^3.2" }
uvicorn = { extras = ["standard"], version = "^0.34" }
gunicorn = "^23.0"
ortools = "^9.11"
googlemaps = "^4.10"
pandas = "^2.2"
openpyxl = "^3.1"
weasyprint = "^63.0"
firebase-admin = "^6.6"
pillow = "^11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.9"
pytest-asyncio = "^0.24"
factory-boy = "^3.3"
ruff = "^0.8"
mypy = "^1.13"
django-stubs = "^5.1"
djangorestframework-stubs = "^3.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"
