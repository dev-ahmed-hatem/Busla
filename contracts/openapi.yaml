            maxLength: 254
          - type: string
            maxLength: 0
        is_primary:
          type: boolean
      required:
      - name
      - student
    Health:
      type: object
      description: Walking-skeleton payload — proves the DRF→OpenAPI→TS/Dart client
        loop.
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        service:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time
      required:
      - service
      - status
      - time
      - version
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    KindEnum:
      enum:
      - supervisor_home
      - student
      - school
      type: string
      description: |-
        * `supervisor_home` - Supervisor home
        * `student` - Student
        * `school` - School
