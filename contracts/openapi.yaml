      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        utilization:
          type: number
          format: double
      required:
      - active
      - inactive
      - total
      - utilization
    LocaleEnum:
      enum:
      - en
      - ar
      type: string
      description: |-
        * `en` - en
        * `ar` - ar
    LoginRequest:
      type: object
      description: Email+password login. Embeds role/school in the token and returns
        the user.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    OptimizeParamsRequest:
