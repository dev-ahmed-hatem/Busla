components:
  schemas:
    Bus:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        bus_number:
          type: string
          maxLength: 32
        license_plate:
          type: string
          maxLength: 32
        model_name:
          type: string
          maxLength: 120
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        odometer_km:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/BusStatusEnum'
        breakdown_reason:
          type: string
          maxLength: 120
        last_maintenance_at:
          type: string
          format: date
          nullable: true
        driver_name:
          type: string
          nullable: true
          readOnly: true
        route_name:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bus_number
      - created_at
      - driver_name
      - id
      - route_name
      - updated_at
    BusRequest:
      type: object
      properties:
        bus_number:
          type: string
          minLength: 1
          maxLength: 32
        license_plate:
          type: string
          maxLength: 32
        model_name:
          type: string
          maxLength: 120
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        odometer_km:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/BusStatusEnum'
        breakdown_reason:
          type: string
          maxLength: 120
        last_maintenance_at:
          type: string
          format: date
          nullable: true
      required:
      - bus_number
    BusStatusEnum:
      enum:
      - in_service
      - maintenance
      - issue
      type: string
      description: |-
        * `in_service` - In Service
        * `maintenance` - Maintenance
        * `issue` - Issue
    CapacityRow:
      type: object
      properties:
        bus:
          type: string
        route:
          type: string
          nullable: true
        capacity:
          type: integer
        occupied:
          type: integer
        available:
          type: integer
      required:
      - available
      - bus
      - capacity
      - occupied
      - route
    DashboardStats:
      type: object
      properties:
        buses:
          $ref: '#/components/schemas/Kpi'
        drivers:
          $ref: '#/components/schemas/Kpi'
        supervisors:
          $ref: '#/components/schemas/Kpi'
        students:
          $ref: '#/components/schemas/Kpi'
        bus_capacity:
          type: array
          items:
            $ref: '#/components/schemas/CapacityRow'
      required:
      - bus_capacity
      - buses
      - drivers
      - students
      - supervisors
    DeviceRegister:
      type: object
      properties:
        token:
          type: string
          maxLength: 512
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - platform
      - token
    DeviceRegisterRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - platform
      - token
    Driver:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        national_id:
          type: string
          maxLength: 32
        license_number:
          type: string
          maxLength: 64
        license_expiry:
          type: string
          format: date
          nullable: true
        experience_years:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        area:
          type: string
          maxLength: 120
        bus:
          type: string
          format: uuid
          nullable: true
        bus_number:
          type: string
          nullable: true
          readOnly: true
        route_name:
          type: string
          nullable: true
          readOnly: true
        status:
          $ref: '#/components/schemas/StaffStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bus_number
      - created_at
      - full_name
      - id
      - route_name
      - updated_at
    DriverRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        national_id:
          type: string
          maxLength: 32
        license_number:
          type: string
          maxLength: 64
