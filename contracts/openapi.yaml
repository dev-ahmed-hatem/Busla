openapi: 3.0.3
info:
  title: BUSLA API
  version: 0.1.0
  description: School-bus fleet operations & real-time tracking platform.
paths:
  /api/v1/auth/devices/:
    post:
      operationId: v1_auth_devices_create
      description: Register/refresh this user's push token (FCM/APNs).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegister'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: POST email+password → {access, refresh, user}.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST {refresh} → blacklist it. Idempotent-ish (invalid token → 205).

        AllowAny: possessing the refresh token is sufficient to revoke it, and the web BFF
        calls this with the refresh cookie but no bearer token.
      tags:
      - v1
      security:
      - {}
      responses:
        '205':
          description: Logged out
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/password-reset/:
