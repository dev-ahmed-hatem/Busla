name: busla_core
description: Shared foundation for the BUSLA Flutter apps (auth, api, models, realtime, design system, l10n, push).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  google_maps_flutter: ^2.9.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  flutter_lints: ^5.0.0

flutter:
  generate: true
