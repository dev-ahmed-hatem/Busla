# BUSLA local stack. Run from repo root: `make up`.
name: busla

x-api-env: &api-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key}
  DATABASE_URL: postgis://busla:busla@db:5432/busla
  REDIS_URL: redis://redis:6379/0
  CHANNELS_REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: redis://redis:6379/3
  GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: busla
      POSTGRES_USER: busla
      POSTGRES_PASSWORD: busla
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes: ["../../apps/api:/app", "../../contracts:/contracts"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    command: celery -A config worker -l info -Q default,imports,reports,notifications,tracking
    volumes: ["../../apps/api:/app"]
    depends_on: [api, redis]

  worker_opt:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    command: celery -A config worker -l info -Q optimize -c 2
    volumes: ["../../apps/api:/app"]
    depends_on: [api, redis]

  beat:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    command: celery -A config beat -l info
    volumes: ["../../apps/api:/app"]
    depends_on: [api, redis]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/proxy.conf:/etc/nginx/proxy.conf:ro
    ports: ["8080:80"]
    depends_on: [web, api]

volumes:
  pgdata:
