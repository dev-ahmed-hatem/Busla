# Prod-like reverse proxy: / → web, /api + /ws + /admin → api (with WS upgrade).
upstream web { server web:3000; }
upstream api { server api:8000; }

server {
    listen 80;

    location /api/  { proxy_pass http://api; include /etc/nginx/proxy.conf; }
    location /admin/ { proxy_pass http://api; include /etc/nginx/proxy.conf; }
    location /static/ { proxy_pass http://api; }

    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / { proxy_pass http://web; include /etc/nginx/proxy.conf; }
}
