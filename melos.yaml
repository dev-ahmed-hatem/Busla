name: busla
repository: https://github.com/busla/busla

packages:
  - apps/parent_app
  - apps/driver_app
  - flutter_packages/*

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- dart analyze .
    description: Run `dart analyze` in all packages.
  test:
    run: melos exec --dir-exists=test -- flutter test
    description: Run `flutter test` in all packages that have tests.
  format:
    run: melos exec -- dart format .
    description: Format all Dart code.
  gen:
    run: melos exec --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner codegen (freezed/riverpod/json) where present.
